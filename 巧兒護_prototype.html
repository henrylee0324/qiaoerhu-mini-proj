<title>巧兒護派單原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=DM+Sans:wght@500;700&display=swap">
<style>
  /* Layout: a stage. Parent phone on the left, nanny phone on the right, the dispatch engine's event stream between them. Fixed light theme for projectors. */
  :root {
    --bg: #eef2f0;
    --bg-2: #e3e9e6;
    --card: #ffffff;
    --fg: #16302b;
    --muted: #5d706b;
    --line: #d4ddd9;
    --brand: #1d5c52;
    --brand-ink: #ffffff;
    --accent: #e8643c;
    --accent-soft: #fdebe3;
    --good: #2f8f5b;
    --good-soft: #e3f3ea;
    --warn: #c98a12;
    --warn-soft: #fff4d6;
    --phone: #0f1f1c;
    --screen: #f7f9f8;
    --display: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
    --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --num: "DM Sans", "Noto Sans TC", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; }

  /* top bar */
  .bar { height: 60px; display: flex; align-items: center; gap: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--card); border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 19px; }
  .logo svg { width: 26px; height: 26px; }
  .bar .sub { color: var(--muted); font-size: 13px; }
  .bar .spacer { flex: 1; }
  .ctrl { display: flex; align-items: center; gap: 8px; }
  .btn { padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); font-weight: 700; font-size: 13px; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn kbd { font-family: var(--num); font-size: 11px; opacity: .7; margin-left: 4px; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); user-select: none; cursor: pointer; }
  .switch input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--line); position: relative; margin: 0; cursor: pointer; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch input:checked { background: var(--warn); }
  .switch input:checked::after { left: 18px; }
  .badge { font-family: var(--num); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 700; }

  /* stage */
  .stage { height: calc(100% - 60px); display: grid; grid-template-columns: 390px minmax(260px, 420px) 390px; gap: 28px; justify-content: center; align-items: start; padding: 22px max(16px, env(safe-area-inset-left, 0px)) 16px; overflow: auto; }
  .col-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .col-title b { color: var(--fg); font-size: 15px; }

  /* phone */
  .phone { background: var(--phone); border-radius: 38px; padding: 11px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.45); }
  .screen { background: var(--screen); border-radius: 28px; height: min(720px, calc(100vh - 150px)); min-height: 520px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .status { display: flex; justify-content: space-between; padding: 12px 20px 0; font-family: var(--num); font-size: 12px; color: var(--muted); }
  .status b { color: var(--fg); }
  .app-head { padding: 10px 18px 8px; display: flex; justify-content: space-between; align-items: center; }
  .app-head h2 { margin: 0; font-size: 18px; font-family: var(--display); }
  .chip { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 700; font-family: var(--num); background: var(--accent-soft); color: var(--accent); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.brand { background: var(--brand); color: var(--brand-ink); }
  .body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .card.hot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .card.good { border-color: var(--good); }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
  .card .k { font-size: 11px; color: var(--muted); }
  .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: block; }
  textarea { width: 100%; border: 0; background: transparent; resize: none; font: inherit; font-size: 15px; line-height: 1.5; color: var(--fg); padding: 0; height: 74px; }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; }
  .samples button { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  .samples button:hover { color: var(--fg); border-color: var(--fg); }
  .big { width: 100%; padding: 13px; border-radius: 14px; border: 0; font-weight: 700; font-size: 15px; }
  .big.brand { background: var(--brand); color: var(--brand-ink); }
  .big.accent { background: var(--accent); color: #fff; }
  .big.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--muted); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 div { background: var(--bg-2); border-radius: 10px; padding: 7px 10px; font-size: 13px; min-width: 0; }
  .grid2 div span { display: block; font-size: 10px; color: var(--muted); }
  .grid2 div.ai { outline: 1.5px dashed var(--brand); outline-offset: -1.5px; }
  .hint { font-size: 12px; color: var(--muted); }
  .hint b { color: var(--brand); }

  .cand { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .cand:first-of-type { border-top: 0; }
  .cand.top { background: var(--good-soft); margin: 0 -14px; padding: 8px 14px; border-radius: 10px; border-top: 0; }
  .av { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; font-family: var(--num); font-size: 13px; flex: none; }
  .av.lg { width: 44px; height: 44px; font-size: 16px; }
  .av.xl { width: 56px; height: 56px; font-size: 20px; }
  .cand b { display: block; font-size: 14px; line-height: 1.2; }
  .cand small { color: var(--muted); font-size: 11px; }
  .cand .sc { text-align: right; font-family: var(--num); font-weight: 700; font-size: 18px; color: var(--good); line-height: 1; }
  .cand .sc span { display: block; font-size: 10px; color: var(--muted); font-weight: 500; }
  .reasons { display: flex; flex-wrap: wrap; gap: 5px; }
  .reasons span { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--bg-2); }
  .reasons span.ok { background: var(--good-soft); color: var(--good); }
  .who { display: flex; gap: 10px; align-items: center; }
  .who b { display: block; font-size: 15px; line-height: 1.2; }
  .who span { font-size: 12px; color: var(--muted); }
  .score { margin-left: auto; text-align: right; }
  .score b { font-family: var(--num); font-size: 26px; color: var(--good); line-height: 1; display: block; }
  .score span { font-size: 10px; color: var(--muted); }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .meta b { color: var(--fg); font-family: var(--num); }
  .cd { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); padding: 0 4px; }
  .cd b { font-family: var(--num); font-size: 24px; color: var(--fg); }
  .cd.alarm b { color: var(--accent); }
  .steps { display: flex; flex-direction: column; gap: 6px; }
  .st { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 13px; color: var(--muted); align-items: center; }
  .st i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); font-style: normal; }
  .st.on { color: var(--fg); }
  .st.on i { background: var(--good); border-color: var(--good); }
  .st.live i { background: var(--accent); border-color: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(232,100,60,.5)} 100%{box-shadow:0 0 0 9px transparent} }

  /* shift grid (nanny) */
  .shift { display: grid; grid-template-columns: 44px repeat(5, 1fr); gap: 5px; font-size: 11px; text-align: center; }
  .shift span { color: var(--muted); font-family: var(--num); }
  .shift i { display: block; height: 24px; border-radius: 6px; background: var(--bg-2); font-style: normal; }
  .shift i.on { background: var(--brand); }
  .shift i.now { background: var(--accent); }
  .bars { display: grid; gap: 7px; }
  .bars div { display: grid; grid-template-columns: 1fr auto; gap: 4px; font-size: 12px; }
  .bars div span { color: var(--muted); }
  .bars div em { font-style: normal; font-family: var(--num); font-weight: 700; }
  .bars div em.up { color: var(--good); }
  .bars div i { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--bg-2); overflow: hidden; display: block; }
  .bars div i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--good); border-radius: 3px; transition: width .6s ease; }
  .ring { width: 64px; height: 64px; position: relative; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle.v { transition: stroke-dasharray .8s ease; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--num); font-size: 20px; }
  .ring b small { font-size: 10px; color: var(--good); margin-left: 2px; }

  /* push card */
  .push { border: 2px solid var(--accent); border-radius: 18px; padding: 12px 14px; background: var(--card); box-shadow: 0 16px 40px -20px rgba(232,100,60,.6); animation: pop .35s ease; }
  @keyframes pop { from { transform: translateY(-12px); opacity: 0 } to { transform: none; opacity: 1 } }
  .push .t { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .push .t b { font-size: 15px; }
  .push .fee { font-family: var(--num); font-size: 22px; font-weight: 700; }
  .push .fee small { font-size: 11px; color: var(--muted); font-weight: 500; }
  .push .acc { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }

  /* live */
  .live { border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: linear-gradient(180deg, #d9e8e2, #b9d1c8); }
  .live svg { width: 100%; height: 100%; display: block; }
  .live .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: #fff; font-family: var(--num); font-size: 11px; padding: 2px 8px; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
  .live .tag i { width: 7px; height: 7px; border-radius: 50%; background: #ff4b4b; animation: pulse 1s infinite; }
  .toggle { display: flex; justify-content: space-between; align-items: center; }
  .toggle .sw { width: 42px; height: 24px; border-radius: 999px; background: var(--good); position: relative; }
  .toggle .sw::after { content: ""; position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .stars { display: flex; gap: 4px; }
  .stars button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--line); font-size: 20px; line-height: 1; }
  .stars button.on { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .ledger { display: grid; gap: 4px; font-size: 13px; }
  .ledger div { display: flex; justify-content: space-between; }
  .ledger div b { font-family: var(--num); }
  .ledger div.tot { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 700; }
  .done { text-align: center; padding: 16px 0 6px; }
  .done .ck { width: 56px; height: 56px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; margin: 0 auto 10px; font-size: 26px; font-weight: 700; }

  /* engine column */
  .engine { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; height: min(742px, calc(100vh - 128px)); min-height: 540px; display: flex; flex-direction: column; gap: 10px; }
  .engine h2 { margin: 0; font-size: 15px; font-family: var(--display); display: flex; justify-content: space-between; align-items: baseline; }
  .engine h2 span { font-family: var(--num); font-size: 12px; color: var(--muted); font-weight: 500; }
  .progress { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .progress i { height: 5px; border-radius: 3px; background: var(--bg-2); display: block; }
  .progress i.on { background: var(--brand); }
  .progress i.cur { background: var(--accent); }
  .stepname { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
  .stepname b { color: var(--fg); }
  .events { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .ev { display: grid; grid-template-columns: 44px 1fr; gap: 8px; font-size: 13px; padding: 8px 10px; border-radius: 12px; background: var(--bg); border: 1px solid transparent; }
  .ev time { font-family: var(--num); font-size: 12px; color: var(--muted); padding-top: 2px; }
  .ev.cur { border-color: var(--accent); background: var(--accent-soft); }
  .ev.sys { background: var(--good-soft); }
  .ev p { margin: 0; }
  .ev small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .ev code { font-family: var(--num); font-size: 12px; background: rgba(0,0,0,.05); padding: 0 4px; border-radius: 4px; }
  .keys { font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
  .keys kbd { font-family: var(--num); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--card); }

  @media (max-width: 1240px) { .stage { grid-template-columns: 390px minmax(220px, 300px) 390px; gap: 16px; } }
  @media (max-width: 1060px) { .stage { grid-template-columns: 1fr; justify-items: center; overflow-y: auto; } .engine { width: 100%; max-width: 390px; height: auto; min-height: 0; } body { overflow: auto; } .col { width: 100%; max-width: 390px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<header class="bar">
  <div class="logo">
    <svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="var(--brand)"/><path d="M15 6v9l5 4" stroke="var(--brand-ink)" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle cx="15" cy="15" r="2" fill="var(--accent)"/></svg>
    巧兒護
  </div>
  <span class="sub">臨托即時派單原型 · 家長端與保母端</span>
  <span class="badge">示範資料</span>
  <span class="spacer"></span>
  <div class="ctrl">
    <label class="switch" title="開啟後，推播階段會模擬 30 分鐘無人接單，再擴大範圍重推"><input type="checkbox" id="noone"> 模擬無人接單</label>
    <button class="btn" id="prev">上一步<kbd>←</kbd></button>
    <button class="btn primary" id="next">下一步<kbd>Space</kbd></button>
    <button class="btn" id="auto">自動播放</button>
    <button class="btn" id="reset">重置<kbd>R</kbd></button>
  </div>
</header>

<main class="stage">
  <div class="col">
    <div class="col-title"><b>家長端</b><span>小潔 · 急托保障會員</span></div>
    <div class="phone"><div class="screen" id="parent"></div></div>
  </div>

  <div class="engine">
    <h2>派單引擎 <span id="eng-time">07:02</span></h2>
    <div class="progress" id="progress"></div>
    <div class="stepname"><span>步驟 <b class="num" id="stepno">0 / 7</b></span><b id="stepname">等待需求</b></div>
    <div class="events" id="events"></div>
    <div class="keys"><span><kbd>Space</kbd> / <kbd>→</kbd> 下一步</span><span><kbd>←</kbd> 上一步</span><span><kbd>R</kbd> 重置</span></div>
  </div>

  <div class="col">
    <div class="col-title"><b>保母端</b><span>林雅婷 · 保母技術士</span></div>
    <div class="phone"><div class="screen" id="nanny"></div></div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var parentEl = $('parent'), nannyEl = $('nanny'), eventsEl = $('events');

  // ---------- demo data ----------
  var SAMPLES = [
    '小孩 2 歲發燒 38.5，8 點要人到大安區，要會換尿布',
    '4 歲腸胃炎在家休息，今天 9 點到下午 1 點，會餵藥優先',
    '雙胞胎 3 歲，臨時要出差，明天 7:30 到 12:00，信義路四段'
  ];
  var CHILD = { name: '小安', age: '2 歲 3 個月', weight: '12 kg', allergy: '無', med: '退燒藥水（依醫囑 6 小時一次）', sleep: '午睡要抱小被子', rule: '不看螢幕' };
  var CANDS = [
    { n: '林雅婷', i: '林', score: 92, km: 0.9, eta: 23, tags: ['證照已驗證', '12 次全準時', '曾服務你家 2 次'], top: true },
    { n: '陳怡君', i: '陳', score: 88, km: 1.4, eta: 28, tags: ['證照已驗證', '2 歲經驗 30 次'] },
    { n: '黃書涵', i: '黃', score: 85, km: 2.1, eta: 35, tags: ['幼教系四年級', '透明托育 100%'] },
    { n: '王若瑜', i: '王', score: 81, km: 1.8, eta: 31, tags: ['證照已驗證', '新加入 2 個月'] },
    { n: '張筱琪', i: '張', score: 79, km: 2.6, eta: 40, tags: ['幼教系三年級'] }
  ];
  var FEE = { base: 1400, urgentPct: 20, bonus: 100 };

  // ---------- text -> structured (rule based, stands in for the LLM) ----------
  function parse(text) {
    var age = (text.match(/(\d+)\s*歲/) || [])[1] || '2';
    var tomorrow = /明天/.test(text);
    // only "H:MM" or "H 點" count as times; "2 歲" and "38.5" must not
    var times = [], re = /(下午)?\s*(\d{1,2}):(\d{2})|(下午)?\s*(\d{1,2})\s*點/g, mm;
    while ((mm = re.exec(text))) {
      var pm = !!(mm[1] || mm[4]), h = parseInt(mm[2] || mm[5], 10), mi = mm[3] || '00';
      if (pm && h < 12) h += 12;
      times.push(h + ':' + mi);
    }
    var start = times[0] || '8:00';
    var end = times[1] || null;
    var place = (text.match(/(大安區|信義路四段|和平東路|復興南路|敦化南路|中正區)/) || [])[1] || '大安區';
    var skills = [];
    if (/尿布/.test(text)) skills.push('換尿布');
    if (/餵藥/.test(text)) skills.push('餵藥');
    if (/雙胞胎/.test(text)) skills.push('同時照顧兩位');
    if (/副食品|餵食/.test(text)) skills.push('副食品');
    if (!skills.length) skills.push('一般照護');
    var cond = /發燒/.test(text) ? '發燒 ' + ((text.match(/(\d{2}(?:\.\d)?)\s*度?/) || [])[1] || '38.5') : /腸胃炎/.test(text) ? '腸胃炎' : /出差|不在家/.test(text) ? '家長不在家' : '無';
    return [
      ['時間', (tomorrow ? '明天 ' : '今天 ') + start + (end ? ' 到 ' + end : ' 起，約 3.5 小時')],
      ['地點', place + '（門牌已預存）'],
      ['孩子', age + ' 歲' + (/雙胞胎/.test(text) ? ' ×2' : '') + '，' + CHILD.name],
      ['需要技能', skills.join('、')],
      ['狀況', cond],
      ['單別', '加急單（2 小時內到）']
    ];
  }

  // ---------- state ----------
  var FLOW = ['idle', 'parsed', 'pushed', 'accepted', 'service', 'review', 'done'];
  var FLOW_NOONE = ['idle', 'parsed', 'pushed', 'expanded', 'accepted', 'service', 'review', 'done'];

    $('eng-time').textContent = timeOf(state());
    eventsEl.innerHTML = eventsFor().map(function (x) { return '<div class="ev' + (x.cur ? ' cur' : '') + '"><time>' + x.e[0] + '</time><div><p>' + x.e[1] + '</p><small>' + x.e[2] + '</small></div></div>'; }).join('');
    eventsEl.scrollTop = eventsEl.scrollHeight;
    $('prev').disabled = S.step === 0;
    $('next').disabled = S.step === f.length - 1;
  }

  // ---------- countdowns (demo speed) ----------
  function stopTimers() { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } }
  function startCountdown(exp) {
    stopTimers();
    var cdEl = parentEl.querySelector('#cd'); if (!cdEl) return;
    var left = 30 * 60, t0 = Date.now(), speed = S.noone && !exp ? 120 : 20; // no-one mode: first round burns down fast
    cdTimer = setInterval(function () {
      var l = Math.max(0, left - Math.floor((Date.now() - t0) / 1000) * speed);
      cdEl.textContent = String(Math.floor(l / 60)).padStart(2, '0') + ':' + String(l % 60).padStart(2, '0');
      if (l === 0) { clearInterval(cdTimer); cdTimer = null; if (S.noone && !exp && state() === 'pushed') next(); }
    }, 200);
  }
  function startAcceptCountdown(elm, exp) {
    if (!elm) return;
    var left = 90, t0 = Date.now();
    var t = setInterval(function () {
      if (!document.body.contains(elm)) { clearInterval(t); return; }
      var l = Math.max(0, left - Math.floor((Date.now() - t0) / 1000) * (S.noone && !exp ? 6 : 1));
      elm.textContent = l + ' 秒';
      if (l === 0) clearInterval(t);
    }, 250);
  }

  // ---------- navigation ----------
  function render() { renderParent(); renderNanny(); renderEngine(); }
  function next() {
    if (S.step >= flow().length - 1) return;
    if (state() === 'idle') { S.text = (parentEl.querySelector('#need') || { value: S.text }).value.trim() || SAMPLES[0]; S.parsed = parse(S.text); }
    S.step++; stopTimers(); render();
  }
  function prev() { if (S.step === 0) return; S.step--; stopTimers(); render(); }
  function reset() { S.step = 0; S.stars = 5; stopAuto(); stopTimers(); render(); }
  function stopAuto() { if (S.auto) { clearInterval(S.auto); S.auto = null; $('auto').textContent = '自動播放'; } }
  function toggleAuto() {
    if (S.auto) { stopAuto(); return; }
    if (S.step >= flow().length - 1) S.step = 0;
    $('auto').textContent = '停止自動';
    render();
    S.auto = setInterval(function () { if (S.step >= flow().length - 1) { stopAuto(); return; } if (S.noone && state() === 'pushed') return; next(); }, 3000);
  }

  $('next').addEventListener('click', next);
  $('prev').addEventListener('click', prev);
  $('reset').addEventListener('click', reset);
  $('auto').addEventListener('click', toggleAuto);
  $('noone').addEventListener('change', function (e) {
    S.noone = e.target.checked;
    // keep the same named state when the flow changes length
    var name = state(); S.step = Math.max(0, flow().indexOf(name)); if (S.step < 0) S.step = 0;
    stopTimers(); render();
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'TEXTAREA' || tag === 'INPUT') { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); next(); } return; }
    if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'r' || e.key === 'R') { reset(); }
  });

  S.parsed = parse(S.text);
  // #s3 in the link opens at step 3 (presenter shortcut; no state beyond the step number)
  var m = /^#s(\d)$/.exec(location.hash || '');
  if (m) S.step = Math.min(+m[1], flow().length - 1);
  render();
})();
</script>
